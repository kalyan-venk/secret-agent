# Self-hosted Qdrant for the RAG store. No account, no cloud, no key.
#
#   docker compose up -d qdrant
#   curl -s localhost:6333/readyz   # -> OK
#
# 6333 is the REST/HTTP port the qdrant-client uses by default; 6334 is gRPC.
# The named volume persists the collection so a restart does not lose the
# embedded corpus. Everything the RAG layer needs is local and reproducible.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: secret-agent-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
